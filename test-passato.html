<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🇮🇹 Тест · Passato Prossimo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#1b1510;--card:#251d16;--card2:#2c2219;--line:#3a2d22;--txt:#f4ede2;--muted:#9c8b76;--oro:#d9a441;--oro2:#e6bd5c;--verde:#6ba368;--verde2:#7fbf7a;--terra:#c96f4a;--rosso:#c1553f;--blu:#4f8a86;--viola:#a06a86;--green-bg:rgba(107,163,104,.16);--red-bg:rgba(193,85,63,.16);--shadow:0 8px 30px rgba(0,0,0,.4)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--txt);font-family:'Inter',sans-serif;min-height:100vh;line-height:1.55}
.wrap{max-width:740px;margin:0 auto;padding:0 18px 90px}
header.top{text-align:center;margin:0 -18px 18px;padding:32px 20px 22px;background:linear-gradient(135deg,#1b1510,#5c3220 55%,#3a2416);border-bottom:1px solid var(--line);position:relative;overflow:hidden}
header.top::after{content:'⏪';position:absolute;font-size:7rem;opacity:.05;top:50%;left:50%;transform:translate(-50%,-50%)}
header.top .flag{font-size:1.8rem;letter-spacing:.3em;position:relative}
header.top h1{font-family:'Fraunces',serif;font-weight:700;font-size:clamp(1.5rem,5.5vw,2.4rem);color:var(--oro2);margin:.1em 0 .04em;position:relative}
header.top p{color:var(--muted);font-size:.88rem;font-style:italic;font-family:'Fraunces',serif;position:relative}
.scorebar{position:sticky;top:0;z-index:30;margin:0 -18px 16px;padding:11px 18px;background:rgba(27,21,16,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.scorebar .label{font-weight:700;color:var(--oro);font-size:.78rem;letter-spacing:.04em;text-transform:uppercase}
.bar{flex:1;min-width:110px;height:9px;background:var(--card2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--verde),var(--oro));transition:width .5s}
.scorebar .nums{font-weight:700;font-size:.95rem}.scorebar .nums b{color:var(--verde2)}
#api{background:#150f0b;border:1px solid var(--line);border-radius:12px;padding:10px 13px;margin-bottom:16px;font-size:.74rem}
.api-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.api-in{flex:1;min-width:150px;background:var(--card2);border:1px solid var(--line);border-radius:7px;color:var(--txt);font-size:.76rem;padding:7px 10px;outline:none;font-family:'Inter'}
.btn-c{background:var(--viola);border:none;border-radius:7px;color:#fff;font-weight:700;font-size:.74rem;padding:7px 13px;cursor:pointer}
.btn-x{background:var(--card2);border:1px solid var(--line);border-radius:7px;color:var(--muted);font-size:.74rem;padding:7px 10px;cursor:pointer}
#st{font-size:.68rem;margin-top:4px;min-height:13px;color:var(--muted)}#st.ok{color:var(--verde2)}#st.err{color:var(--rosso)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#5a4a3a;margin-right:5px}.dot.on{background:var(--verde)}
.hint{font-size:.66rem;color:#7a6a58;margin-top:5px}
.tsec{font-family:'Fraunces',serif;color:var(--oro2);font-size:1.15rem;font-weight:600;margin:20px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.q{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px 16px;margin-bottom:10px;box-shadow:var(--shadow)}
.q.ok{border-color:var(--verde)}
.q .qt{font-size:1.05rem;line-height:1.7}
.q .qt .ru{display:block;color:var(--muted);font-size:.82rem;font-style:italic;margin-top:1px}
.gap{display:inline-block;min-width:70px;text-align:center;border-bottom:2px dashed var(--oro);color:var(--muted);padding:0 6px;font-weight:700;letter-spacing:2px}
.gap.f{color:var(--verde2);border-bottom-style:solid;border-color:var(--verde);letter-spacing:0}
.gap.w{color:var(--terra);border-bottom-style:solid;border-color:var(--rosso);letter-spacing:0}
.qopts{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
.qo{background:var(--card2);border:1px solid var(--line);color:var(--txt);padding:8px 14px;border-radius:9px;cursor:pointer;font-family:'Fraunces',serif;font-weight:600;font-size:1rem}
.qo:hover{border-color:var(--oro);color:var(--oro2)}
.qo.ok{background:var(--green-bg);border-color:var(--verde);color:var(--verde2)}
.qo.no{background:var(--red-bg);border-color:var(--rosso);color:var(--terra)}
.spk2{background:none;border:none;color:var(--viola);cursor:pointer;font-size:1rem;vertical-align:middle}
.bigbtn{display:inline-block;margin:16px 6px 0;border:1px solid var(--line);background:var(--card2);color:var(--txt);font-family:'Inter';font-weight:700;font-size:.86rem;padding:10px 18px;border-radius:10px;cursor:pointer}
.bigbtn:hover{border-color:var(--oro);color:var(--oro2)}
.done{text-align:center;padding:26px 18px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);margin-top:14px}
.done .big{font-size:2.6rem}
.done h2{font-family:'Fraunces',serif;color:var(--oro2);font-size:1.4rem;margin:6px 0}
.done .score{font-family:'Fraunces',serif;font-size:2rem;color:var(--verde2)}
footer{text-align:center;color:var(--muted);font-size:.82rem;margin-top:26px;padding-top:16px;border-top:1px solid var(--line)}footer a{color:var(--oro)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(60px);background:var(--oro);color:#1a1206;font-weight:700;padding:11px 20px;border-radius:99px;box-shadow:var(--shadow);opacity:0;transition:.35s;z-index:60;font-size:.9rem}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="flag">🇮🇹</div>
    <h1>Test · Passato Prossimo</h1>
    <p>28 заданий: avere/essere, причастия, согласование</p>
  </header>
  <div class="scorebar"><span class="label">Risultato</span><div class="bar"><i id="fill"></i></div><span class="nums"><b id="ok">0</b> / <span id="tot">0</span></span></div>
  <div id="api">
    <div class="api-row"><span><span class="dot" id="dot"></span>🔊 Google TTS</span>
      <input class="api-in" id="key" type="password" placeholder="API ключ (необязательно)">
      <button class="btn-c" onclick="connectKey()">OK</button>
      <button class="btn-x" id="clr" style="display:none" onclick="clearKey()">✕</button></div>
    <div id="st"></div><div class="hint" id="hint">Тот же ключ, что в словаре. Без ключа — голос браузера.</div>
  </div>
  <div id="content"></div>
  <div style="text-align:center"><button class="bigbtn" onclick="build()">↺ Заново</button></div>
  <footer>Нажми вариант — подсветится и произнесётся. <a href="index.html">← Главная</a></footer>
</div>
<div class="toast" id="toast"></div>
<script>
/* A: выбор avere/essere для инфинитива */
const AUXV=[
["mangiare","есть","a"],["parlare","говорить","a"],["comprare","покупать","a"],["leggere","читать","a"],
["scrivere","писать","a"],["prendere","брать","a"],["fare","делать","a"],["bere","пить","a"],
["andare","идти, ехать","e"],["venire","приходить","e"],["partire","уезжать","e"],["tornare","возвращаться","e"],
["arrivare","прибывать","e"],["uscire","выходить","e"],["entrare","входить","e"],["nascere","рождаться","e"],
];
/* B: выбор причастия (неправильные) */
const PART=[
["fare","fatto"],["dire","detto"],["prendere","preso"],["leggere","letto"],["scrivere","scritto"],
["vedere","visto"],["mettere","messo"],["chiedere","chiesto"],["aprire","aperto"],["chiudere","chiuso"],
["rompere","rotto"],["perdere","perso"],["vincere","vinto"],["bere","bevuto"],["nascere","nato"],
];
/* C: фразы на согласование причастия с essere — [фраза с @, причастие, перевод] */
const AGREE=[
["Maria è @ a casa presto.","tornata","Мария рано вернулась домой."],
["I ragazzi sono @ al mare ieri.","andati","Ребята вчера поехали на море."],
["Le mie amiche sono @ da Milano.","arrivate","Мои подруги приехали из Милана."],
["Mio fratello è @ alle sette.","uscito","Мой брат вышел в семь."],
["Le bambine sono @ in giardino.","entrate","Девочки вошли в сад."],
["Noi (uomini) siamo @ presto.","partiti","Мы (мужчины) уехали рано."],
["Sara è @ in Italia nel 1990.","nata","Сара родилась в Италии в 1990."],
["Le ragazze si sono @ tardi.","svegliate","Девушки проснулись поздно."],
];

let ttsKey=localStorage.getItem('it_tts_key')||'';
let ttsVoice=localStorage.getItem('it_tts_voice')||'it-IT-Neural2-A';
if(/Wavenet|Standard/i.test(ttsVoice)){ttsVoice='it-IT-Neural2-A';localStorage.setItem('it_tts_voice',ttsVoice);}
const cache={};let curAudio=null;
async function gtts(t){if(cache[t])return cache[t];const body={input:{text:t},voice:{languageCode:'it-IT',name:ttsVoice},audioConfig:{audioEncoding:'MP3',speakingRate:0.96,pitch:0,effectsProfileId:['headphone-class-device']}};const r=await fetch(`https://texttospeech.googleapis.com/v1/text:synthesize?key=${ttsKey}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok){const e=await r.json();throw new Error(e.error?.message||'err');}const d=await r.json();cache[t]=d.audioContent;return d.audioContent;}
function bSpeak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='it-IT';u.rate=.95;u.pitch=1.0;const vs=speechSynthesis.getVoices().filter(x=>/^it/i.test(x.lang));const v=vs.find(x=>/google|natural|neural|premium/i.test(x.name))||vs[0];if(v)u.voice=v;speechSynthesis.speak(u);}catch(e){}}
async function speak(t){if(curAudio){curAudio.pause();curAudio=null;}try{if(ttsKey){const b=await gtts(t);const a=new Audio('data:audio/mp3;base64,'+b);curAudio=a;a.play();}else bSpeak(t);}catch(e){setStatus('❌ '+e.message,'err');bSpeak(t);}}
function connectKey(){const k=document.getElementById('key').value.trim();if(!k){setStatus('Введи ключ','err');return;}setStatus('⏳...','');ttsKey=k;delete cache['ciao'];gtts('ciao').then(b=>{localStorage.setItem('it_tts_key',k);markConn();setStatus('✅ Подключено','ok');new Audio('data:audio/mp3;base64,'+b).play();}).catch(e=>{ttsKey='';setStatus('❌ '+e.message,'err');});}
function markConn(){document.getElementById('dot').classList.add('on');document.getElementById('clr').style.display='block';document.getElementById('hint').style.display='none';document.getElementById('key').style.display='none';document.querySelector('.btn-c').style.display='none';}
function clearKey(){ttsKey='';localStorage.removeItem('it_tts_key');location.reload();}
function setStatus(m,t){const e=document.getElementById('st');e.textContent=m;e.className=t;}
function norm(s){return (s||'').toLowerCase().trim().replace(/[''`]/g,"'").replace(/\s+/g,' ').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[.?!,;]+$/,'');}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function esc(s){return (s+'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function sp(t){return (t||'').replace(/'/g,"\\'");}

let TOTAL=0;const done=new Set();
function build(){
  TOTAL=0;done.clear();
  // A: avere/essere (10 из 16)
  const selA=shuffle(AUXV).slice(0,10);
  let a=selA.map((x,i)=>{TOTAL++;const k='a'+i;const [inf,ru,aux]=x;const correct=aux==='a'?'avere':'essere';
    const say=(aux==='a'?'ho ':'sono ')+inf.replace(/(are|ere|ire)$/,m=>({are:'ato',ere:'uto',ire:'ito'}[m]));
    return `<div class="q" id="q_${k}"><div class="qt">${esc(inf)} <button class="spk2" onclick="speak('${sp(inf)}')">🔊</button> → <span class="gap" id="g_${k}">?</span><span class="ru">${esc(ru)}</span></div>
      <div class="qopts">${shuffle(['avere','essere']).map(o=>`<button class="qo" onclick="ansT('${k}',this,'${o}','${correct}','${sp(inf)}')">${o}</button>`).join('')}</div></div>`;}).join('');
  // B: причастия неправильные (10 из 15)
  const selB=shuffle(PART).slice(0,10);
  let b=selB.map((x,i)=>{TOTAL++;const k='b'+i;const [inf,pp]=x;
    const opts=shuffle([pp].concat(shuffle(PART.filter(y=>y[1]!==pp)).slice(0,3).map(y=>y[1])));
    return `<div class="q" id="q_${k}"><div class="qt">${esc(inf)} → <span class="gap" id="g_${k}">?</span> <button class="spk2" onclick="speak('${sp(pp)}')">🔊</button></div>
      <div class="qopts">${opts.map(o=>`<button class="qo" onclick="ansT('${k}',this,'${sp(o)}','${sp(pp)}','${sp(o)}')">${esc(o)}</button>`).join('')}</div></div>`;}).join('');
  // C: согласование причастия с essere (8)
  const selC=shuffle(AGREE);
  let c=selC.map((x,i)=>{TOTAL++;const k='c'+i;const [phrase,pp,ru]=x;
    const stem=pp.replace(/[oae]$/,'');const forms=[stem+'o',stem+'a',stem+'i',stem+'e'];
    const opts=shuffle(forms.filter((f,idx,arr)=>arr.indexOf(f)===idx));
    const text=esc(phrase).replace('@',`<span class="gap" id="g_${k}">?</span>`);
    return `<div class="q" id="q_${k}"><div class="qt">${text} <button class="spk2" onclick="speak('${sp(phrase.replace('@',pp))}')">🔊</button><span class="ru">${esc(ru)}</span></div>
      <div class="qopts">${opts.map(o=>`<button class="qo" onclick="ansT('${k}',this,'${sp(o)}','${sp(pp)}','${sp(phrase.replace('@',o))}')">${esc(o)}</button>`).join('')}</div></div>`;}).join('');
  document.getElementById('content').innerHTML=
    `<div class="tsec">A · Avere или essere?</div>${a}
     <div class="tsec">B · Неправильные причастия</div>${b}
     <div class="tsec">C · Согласование с essere</div>${c}
     <div id="donebox"></div>`;
  document.getElementById('tot').textContent=TOTAL;document.getElementById('ok').textContent=0;document.getElementById('fill').style.width='0%';
}
function ansT(k,btn,chosen,correct,say){
  speak(say);const good=norm(chosen)===norm(correct);
  const g=[...document.querySelectorAll('#q_'+k+' .qo')];g.forEach(x=>x.style.pointerEvents='none');
  if(good){btn.classList.add('ok');done.add(k);}else{btn.classList.add('no');g.forEach(x=>{if(norm(x.textContent)===norm(correct))x.classList.add('ok');});}
  const gap=document.getElementById('g_'+k);gap.textContent=chosen;gap.className='gap '+(good?'f':'w');
  document.getElementById('q_'+k).classList.toggle('ok',good);
  document.getElementById('ok').textContent=done.size;document.getElementById('fill').style.width=(done.size/TOTAL*100)+'%';
  if(done.size===TOTAL)showDone();
}
function showDone(){
  const pct=Math.round(done.size/TOTAL*100);
  let emo='🌱',txt='Продолжай тренироваться!';
  if(pct>=95){emo='🏆';txt='Perfetto!';}else if(pct>=80){emo='🎉';txt='Molto bene!';}else if(pct>=60){emo='👍';txt='Bene!';}
  document.getElementById('donebox').innerHTML=`<div class="done"><div class="big">${emo}</div><h2>Тест завершён!</h2><div class="score">${done.size} / ${TOTAL}</div><p style="color:var(--muted);margin-top:6px">${txt}</p></div>`;
  toast('🎉 Tutto giusto!');
}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(window._t);window._t=setTimeout(()=>t.classList.remove('show'),1800);}

if('speechSynthesis' in window)speechSynthesis.getVoices();
if(ttsKey)markConn();
build();
</script>
</body>
</html>
