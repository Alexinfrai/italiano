<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🇮🇹 Тренажёр · Passato Prossimo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#1b1510;--card:#251d16;--card2:#2c2219;--line:#3a2d22;--txt:#f4ede2;--muted:#9c8b76;--oro:#d9a441;--oro2:#e6bd5c;--verde:#6ba368;--verde2:#7fbf7a;--terra:#c96f4a;--rosso:#c1553f;--blu:#4f8a86;--viola:#a06a86;--green-bg:rgba(107,163,104,.16);--red-bg:rgba(193,85,63,.16);--shadow:0 8px 30px rgba(0,0,0,.4)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--txt);font-family:'Inter',sans-serif;min-height:100vh;line-height:1.5}
header{text-align:center;padding:28px 18px 16px;background:linear-gradient(135deg,#1b1510,#5c3220 55%,#3a2416);border-bottom:1px solid var(--line);position:relative;overflow:hidden}
header::after{content:'⏪';position:absolute;font-size:7rem;opacity:.05;top:50%;left:50%;transform:translate(-50%,-50%)}
header .flag{font-size:1.8rem;letter-spacing:.3em;position:relative}
header h1{font-family:'Fraunces',serif;font-weight:700;font-size:clamp(1.5rem,5vw,2.4rem);color:var(--oro2);margin:.08em 0 .04em;position:relative}
header p{color:var(--muted);font-size:.86rem;font-style:italic;font-family:'Fraunces',serif;position:relative}
#api{background:#150f0b;border-bottom:1px solid var(--line);padding:8px 14px;font-size:.72rem}
.api-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.api-in{flex:1;min-width:150px;background:var(--card2);border:1px solid var(--line);border-radius:7px;color:var(--txt);font-size:.76rem;padding:7px 10px;outline:none;font-family:'Inter'}
.btn-c{background:var(--viola);border:none;border-radius:7px;color:#fff;font-weight:700;font-size:.74rem;padding:7px 13px;cursor:pointer}
.btn-x{background:var(--card2);border:1px solid var(--line);border-radius:7px;color:var(--muted);font-size:.74rem;padding:7px 10px;cursor:pointer}
#st{font-size:.66rem;margin-top:4px;min-height:12px;color:var(--muted)}#st.ok{color:var(--verde2)}#st.err{color:var(--rosso)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#5a4a3a;margin-right:5px}.dot.on{background:var(--verde)}
.hint{font-size:.64rem;color:#7a6a58;margin-top:5px}
.wrap{max-width:640px;margin:0 auto;padding:18px 16px 90px}
.modes{display:flex;gap:6px;justify-content:center;margin-bottom:16px;flex-wrap:wrap}
.nb{border:1px solid var(--line);background:var(--card);color:var(--muted);padding:9px 16px;border-radius:99px;font-weight:700;font-size:.82rem;cursor:pointer;transition:.15s}
.nb.on{background:var(--viola);border-color:var(--viola);color:#fff}
.prog{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.bar{flex:1;height:9px;background:var(--card2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--verde),var(--oro));transition:.4s}
.prog .n{font-weight:700;font-size:.85rem;color:var(--muted)}.prog .n b{color:var(--verde2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px 22px;box-shadow:var(--shadow);text-align:center;min-height:230px;display:flex;flex-direction:column;justify-content:center;position:relative}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--oro),var(--terra));border-radius:18px 18px 0 0}
.card .tag{position:absolute;top:12px;right:14px;font-size:.62rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:2px 9px}
.card .aux{position:absolute;top:12px;left:14px;font-size:.62rem;text-transform:uppercase;letter-spacing:.04em;border-radius:99px;padding:2px 9px}
.card .aux.a{color:var(--oro);border:1px solid var(--oro)}
.card .aux.e{color:var(--blu);border:1px solid var(--blu)}
.card .big-q{font-family:'Fraunces',serif;font-size:1.7rem;font-weight:700;color:var(--txt)}
.card .big-q small{display:block;font-family:'Inter';font-size:.88rem;color:var(--muted);font-weight:400;margin-top:6px}
.card .cue{color:var(--muted);font-size:.85rem;font-style:italic;font-family:'Fraunces',serif;margin-top:8px}
.card .ans{font-family:'Fraunces',serif;font-size:1.6rem;font-weight:700;color:var(--verde2);margin-top:14px;display:none}
.card .ans.show{display:block;animation:pop .25s}@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1}}
.card .ans .full{display:block;font-size:.92rem;color:var(--muted);font-weight:400;margin-top:4px;font-family:'Inter'}
.card .ans .spk{cursor:pointer;color:var(--viola);margin-left:6px;font-size:1rem}
.inp{width:100%;margin-top:16px;background:var(--card2);border:1px solid var(--line);border-bottom:2px solid var(--oro);border-radius:8px;color:var(--oro2);font-family:'Fraunces',serif;font-size:1.2rem;font-weight:700;text-align:center;padding:11px;outline:none}
.fb{margin-top:9px;font-weight:700;font-size:.92rem;min-height:20px}.fb.ok{color:var(--verde2)}.fb.no{color:var(--terra)}
.opts{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.opt{background:var(--card2);border:1px solid var(--line);color:var(--txt);padding:12px 16px;border-radius:11px;cursor:pointer;font-family:'Fraunces',serif;font-weight:600;font-size:1.1rem;transition:.15s}
.opt:hover{border-color:var(--oro);color:var(--oro2)}
.opt.ok{background:var(--green-bg);border-color:var(--verde);color:var(--verde2)}
.opt.no{background:var(--red-bg);border-color:var(--rosso);color:var(--terra)}
.btns{display:flex;gap:10px;margin-top:18px}
.bigb{flex:1;border:none;border-radius:12px;font-family:'Inter';font-weight:700;font-size:1rem;padding:15px;cursor:pointer;transition:.15s}
.bigb.rev{background:var(--oro);color:#1a1206}.bigb.rev:hover{background:var(--oro2)}
.bigb.no{background:var(--red-bg);color:var(--terra);border:1px solid var(--rosso)}
.bigb.ok{background:var(--green-bg);color:var(--verde2);border:1px solid var(--verde)}
.sub{display:flex;justify-content:space-between;margin-top:14px;font-size:.8rem}
.sub button{background:none;border:none;color:var(--muted);cursor:pointer;text-decoration:underline;font-family:'Inter';font-size:.8rem}
.sub button:hover{color:var(--oro)}
footer{text-align:center;color:var(--muted);font-size:.8rem;margin-top:24px;padding-top:16px;border-top:1px solid var(--line)}footer a{color:var(--oro)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(60px);background:var(--oro);color:#1a1206;font-weight:700;padding:11px 20px;border-radius:99px;box-shadow:var(--shadow);opacity:0;transition:.35s;z-index:60;font-size:.9rem}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<header>
  <div class="flag">🇮🇹</div>
  <h1>Тренажёр · Passato Prossimo</h1>
  <p>Ставь глагол в прошедшее время</p>
</header>
<div id="api">
  <div class="api-row"><span><span class="dot" id="dot"></span>🔊 Google TTS</span>
    <input class="api-in" id="key" type="password" placeholder="API ключ (необязательно)">
    <button class="btn-c" onclick="connectKey()">OK</button>
    <button class="btn-x" id="clr" style="display:none" onclick="clearKey()">✕</button></div>
  <div id="st"></div><div class="hint" id="hint">Тот же ключ, что в словаре. Без ключа — голос браузера.</div>
</div>
<div class="wrap">
  <div class="modes" id="trmodes">
    <button class="nb on" onclick="setTM('choice',this)">🔀 Выбор</button>
    <button class="nb" onclick="setTM('type',this)">⌨️ Ввод</button>
    <button class="nb" onclick="setTM('audio',this)">🎧 На слух</button>
  </div>
  <div class="prog"><span class="n">Верно: <b id="ok">0</b></span><div class="bar"><i id="fill"></i></div><span class="n" id="streak"></span></div>
  <div class="card" id="card"></div>
  <div class="sub"><button onclick="nextT()">→ Пропустить</button><button onclick="resetT()">↺ Сброс</button></div>
  <footer>27 глаголов · avere и essere вперемешку · озвучка Neural2 · <a href="index.html">← Главная</a></footer>
</div>
<div class="toast" id="toast"></div>
<script>
/* [инфинитив, перевод, причастие, aux(a/e), возвратный?] */
const V=[
["parlare","говорить","parlato","a",false],
["mangiare","есть","mangiato","a",false],
["comprare","покупать","comprato","a",false],
["studiare","учить","studiato","a",false],
["prendere","брать","preso","a",false],
["leggere","читать","letto","a",false],
["scrivere","писать","scritto","a",false],
["vedere","видеть","visto","a",false],
["bere","пить","bevuto","a",false],
["fare","делать","fatto","a",false],
["dire","говорить, сказать","detto","a",false],
["mettere","класть","messo","a",false],
["chiedere","просить","chiesto","a",false],
["aprire","открывать","aperto","a",false],
["chiudere","закрывать","chiuso","a",false],
["perdere","терять","perso","a",false],
["vincere","выигрывать","vinto","a",false],
["conoscere","познакомиться","conosciuto","a",false],
["andare","идти, ехать","andato","e",false],
["venire","приходить","venuto","e",false],
["partire","уезжать","partito","e",false],
["tornare","возвращаться","tornato","e",false],
["arrivare","прибывать","arrivato","e",false],
["uscire","выходить","uscito","e",false],
["entrare","входить","entrato","e",false],
["nascere","рождаться","nato","e",false],
["stare","находиться","stato","e",false],
["diventare","становиться","diventato","e",false],
["rimanere","оставаться","rimasto","e",false],
["alzarsi","вставать","alzato","e",true],
["svegliarsi","просыпаться","svegliato","e",true],
["lavarsi","мыться","lavato","e",true],
["vestirsi","одеваться","vestito","e",true],
["sedersi","садиться","seduto","e",true],
["riposarsi","отдыхать","riposato","e",true],
];

let ttsKey=localStorage.getItem('it_tts_key')||'';
let ttsVoice=localStorage.getItem('it_tts_voice')||'it-IT-Neural2-A';
if(/Wavenet|Standard/i.test(ttsVoice)){ttsVoice='it-IT-Neural2-A';localStorage.setItem('it_tts_voice',ttsVoice);}
const cache={};let curAudio=null;
async function gtts(t){if(cache[t])return cache[t];const body={input:{text:t},voice:{languageCode:'it-IT',name:ttsVoice},audioConfig:{audioEncoding:'MP3',speakingRate:0.96,pitch:0,effectsProfileId:['headphone-class-device']}};const r=await fetch(`https://texttospeech.googleapis.com/v1/text:synthesize?key=${ttsKey}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok){const e=await r.json();throw new Error(e.error?.message||'err');}const d=await r.json();cache[t]=d.audioContent;return d.audioContent;}
function bSpeak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='it-IT';u.rate=.95;u.pitch=1.0;const vs=speechSynthesis.getVoices().filter(x=>/^it/i.test(x.lang));const v=vs.find(x=>/google|natural|neural|premium/i.test(x.name))||vs[0];if(v)u.voice=v;speechSynthesis.speak(u);}catch(e){}}
async function speak(t){if(curAudio){curAudio.pause();curAudio=null;}try{if(ttsKey){const b=await gtts(t);const a=new Audio('data:audio/mp3;base64,'+b);curAudio=a;a.play();}else bSpeak(t);}catch(e){setStatus('❌ '+e.message,'err');bSpeak(t);}}
function connectKey(){const k=document.getElementById('key').value.trim();if(!k){setStatus('Введи ключ','err');return;}setStatus('⏳...','');ttsKey=k;delete cache['ciao'];gtts('ciao').then(b=>{localStorage.setItem('it_tts_key',k);markConn();setStatus('✅ Подключено','ok');new Audio('data:audio/mp3;base64,'+b).play();}).catch(e=>{ttsKey='';setStatus('❌ '+e.message,'err');});}
function markConn(){document.getElementById('dot').classList.add('on');document.getElementById('clr').style.display='block';document.getElementById('hint').style.display='none';document.getElementById('key').style.display='none';document.querySelector('.btn-c').style.display='none';}
function clearKey(){ttsKey='';localStorage.removeItem('it_tts_key');location.reload();}
function setStatus(m,t){const e=document.getElementById('st');e.textContent=m;e.className=t;}
function norm(s){return (s||'').toLowerCase().trim().replace(/[''`]/g,"'").replace(/\s+/g,' ').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[.?!,;]+$/,'');}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function esc(s){return (s+'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function sp(t){return (t||'').replace(/'/g,"\\'");}
function ioForm(v){const[,,pp,aux,refl]=v;if(aux==='a')return'ho '+pp;if(refl)return'mi sono '+pp+'/a';return'sono '+pp+'/a';}
function ioSay(v){return ioForm(v).replace('/a','');}

let tMode='choice',curT=null,okC=0,streak=0,total=0,deck=[];
function buildDeck(){let d=[];V.forEach(v=>{d.push(v);d.push(v);d.push(v);});
 for(let i=d.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[d[i],d[j]]=[d[j],d[i]];}
 for(let i=1;i<d.length;i++){if(d[i]===d[i-1]){for(let k=i+1;k<d.length;k++){if(d[k]!==d[i-1]&&(k+1>=d.length||d[k+1]!==d[i])){[d[i],d[k]]=[d[k],d[i]];break;}}}}
 return d;}
function setTM(m,btn){tMode=m;document.querySelectorAll('#trmodes .nb').forEach(b=>b.classList.remove('on'));btn.classList.add('on');deck=buildDeck();nextT();}
function pickV(){if(deck.length===0){deck=buildDeck();toast('🔄 Новый круг');}let v=deck.pop();if(v===curT&&deck.length>0){const alt=deck.pop();deck.push(v);v=alt;}return v;}

function nextT(){
  if(deck.length===0)deck=buildDeck();
  curT=pickV();const v=curT;const [inf,ru,pp,aux]=v;const c=document.getElementById('card');
  const ans=ioForm(v);const say=ioSay(v);
  if(tMode==='choice'){
    const wrongs=shuffle(V.filter(x=>x!==v)).slice(0,3).map(x=>ioForm(x).replace('/a',''));
    const correctClean=ans.replace('/a','');
    const opts=shuffle([correctClean,...wrongs]);
    c.innerHTML=`<span class="aux ${aux}">${aux==='a'?'avere':'essere'}</span><span class="tag">io</span>
      <div class="big-q">${esc(inf)}<small>${esc(ru)}</small></div>
      <div class="opts">${opts.map(o=>`<button class="opt" onclick="pickOpt(this,'${sp(o)}','${sp(correctClean)}')">${esc(o)}</button>`).join('')}</div>`;
  } else if(tMode==='type'){
    c.innerHTML=`<span class="aux ${aux}">${aux==='a'?'avere':'essere'}</span><span class="tag">io</span>
      <div class="big-q">${esc(inf)}<small>${esc(ru)} — поставь в passato prossimo (io)</small></div>
      <input class="inp" id="inp" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="...">
      <div class="fb" id="fb"></div>
      <div class="ans" id="ansbox">${esc(ans)}<span class="spk" onclick="speak('${sp(say)}')">🔊</span></div>
      <div class="btns" id="tb"><button class="bigb rev" onclick="checkType('${sp(ans)}')">Проверить</button></div>`;
    const i=document.getElementById('inp');i.focus();i.addEventListener('keydown',e=>{if(e.key==='Enter')checkType(ans);});
  } else if(tMode==='audio'){
    const wrongs=shuffle(V.filter(x=>x!==v)).slice(0,3).map(x=>x[0]);
    const opts=shuffle([inf,...wrongs]);
    c.innerHTML=`<span class="tag">🎧 на слух</span>
      <div class="cue">послушай форму — угадай инфинитив</div>
      <button class="bigb rev" style="flex:none;width:auto;margin:10px auto 0;padding:12px 22px" onclick="speak('${sp(say)}')">▶ Повторить</button>
      <div class="opts" style="margin-top:16px">${opts.map(o=>`<button class="opt" onclick="pickOpt(this,'${sp(o)}','${sp(inf)}')">${esc(o)}</button>`).join('')}</div>`;
    setTimeout(()=>speak(say),250);
  }
}
function pickOpt(btn,chosen,correct){
  const good=norm(chosen)===norm(correct);speak(curT?ioSay(curT):chosen);
  document.querySelectorAll('#card .opt').forEach(b=>{b.style.pointerEvents='none';if(norm(b.textContent)===norm(correct))b.classList.add('ok');});
  if(!good)btn.classList.add('no');
  setTimeout(()=>grade(good),850);
}
function checkType(correct){
  const val=document.getElementById('inp').value;
  const variants=[correct,correct.replace('/a',''),correct.replace('/a','a'),correct.replace('/a','o')];
  const good=variants.some(v=>norm(v)===norm(val));
  document.getElementById('ansbox').classList.add('show');
  const fb=document.getElementById('fb');fb.className='fb '+(good?'ok':'no');fb.textContent=good?'✓ Верно!':'✗ Правильно: '+correct;
  speak(correct.replace('/a',''));
  document.getElementById('tb').innerHTML=`<button class="bigb ${good?'ok':'no'}" onclick="grade(${good})">Дальше →</button>`;
}
function grade(ok){total++;if(ok){okC++;streak++;if(streak%5===0)toast('🔥 Серия '+streak);}else streak=0;
  document.getElementById('ok').textContent=okC;document.getElementById('fill').style.width=(total?okC/total*100:0)+'%';
  document.getElementById('streak').textContent=streak>1?('🔥'+streak):'';nextT();}
function resetT(){okC=0;streak=0;total=0;deck=buildDeck();document.getElementById('ok').textContent=0;document.getElementById('fill').style.width='0%';document.getElementById('streak').textContent='';nextT();toast('Сброшено');}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(window._t);window._t=setTimeout(()=>t.classList.remove('show'),1700);}

if('speechSynthesis' in window)speechSynthesis.getVoices();
if(ttsKey)markConn();
deck=buildDeck();
nextT();
</script>
</body>
</html>
